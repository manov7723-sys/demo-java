apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-java
  namespace: this-dev
  labels:
    app.kubernetes.io/name: demo-java
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-java
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
